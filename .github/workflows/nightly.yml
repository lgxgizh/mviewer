# =============================================================================
# MViewer CI — TIER 2: Nightly (scheduled, heavy, NON-blocking for PRs)
# -----------------------------------------------------------------------------
# Runs once per day (and on manual dispatch). Covers the slow, environment-
# sensitive checks that must NOT sit in the PR gate:
#   * ASan  — out-of-bounds / use-after-free / heap overflow (+ leak detect)
#   * UBSan — integer overflow / undefined behaviour / alignment
#   * clazy — Qt-aware static analysis (advisory signal)
#   * quality — CTest bench_* perf hard-gate + golden_image UI regression
#   * perfetto — capture a Chrome-trace JSON under instrumentation (best-effort)
#
# Findings here are alerts, not merge blockers. They raise long-term signal
# without hurting PR velocity. The aggregator `qa-report` is the entry point
# for the nightly QA summary / dashboards.
#
# Reference docs: docs/acceptance/M13.3_perf_budget_gate.md,
#                 docs/acceptance/M13.5_perfetto.md,
#                 docs/known_issues/MSVC_ASAN.md
# =============================================================================

name: Nightly (Tier 2)

on:
  schedule:
    # 02:13 UTC daily — off the top of the hour to avoid runner contention.
    - cron: '13 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # asan — AddressSanitizer (+ LeakSanitizer is built into ASan) via clang-cl
  # ---------------------------------------------------------------------------
  asan:
    name: ASan / LSan (clang-cl)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows headers/libs for clang-cl)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM (clang-cl + llvm-symbolizer)
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          # 22.x carries llvm-project#159618: catch-block parameters are no
          # longer ASan-instrumented on Windows. 21.x reports a bogus
          # access-violation inside every `catch (const T &e)` that touches e
          # (google/sanitizers#749). The action's asset table stops at 21.1.8.
          version: "22.1.8"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure (clang-cl + ASan)
        run: |
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $asanLib = "$llvmShort/lib/clang/22/lib/windows"
          cmake -S . -B build_asan -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_PREFIX_PATH="$Env:Qt6_DIR/../.." `
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG -fsanitize=address /libpath:$asanLib clang_rt.asan_dynamic-x86_64.lib clang_rt.asan_dynamic_runtime_thunk-x86_64.lib" `
            "-DCMAKE_SHARED_LINKER_FLAGS=/DEBUG -fsanitize=address /libpath:$asanLib clang_rt.asan_dynamic-x86_64.lib clang_rt.asan_dynamic_runtime_thunk-x86_64.lib" `
            -DCMAKE_CXX_FLAGS="/MD /EHsc -fsanitize=address -g"

      - name: Build (ASan)
        run: cmake --build build_asan -j 4

      - name: Deploy Qt image plugins for ASan tests
        run: |
          $pluginSrc = "$env:QT_PLUGIN_PATH\imageformats"
          $pluginDst = "build_asan\bin\imageformats"
          New-Item -ItemType Directory -Force -Path $pluginDst | Out-Null
          Copy-Item "$pluginSrc\*.dll" $pluginDst -Force

      - name: Generate testdata fixtures
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python testdata/generate_fixtures.py --size 256x256
          python testdata/generate_large_fixtures.py --ensure

      - name: Test (ASan + LeakSanitizer)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $env:PATH = "$llvmShort\bin;$llvmShort\lib\clang\22\lib\windows;$env:PATH"
          # detect_leaks is unsupported on Windows and aborts every test at
          # startup. The Linux GCC job below keeps detect_leaks=1.
          # symbolize=1 plus llvm-symbolizer: without PDBs (/DEBUG above) and
          # a symbolizer, frames are exe+offset or the nearest DLL export.
          $env:ASAN_OPTIONS = "detect_odr_violation=0:symbolize=1"
          $env:ASAN_SYMBOLIZER_PATH = "$llvmShort\bin\llvm-symbolizer.exe"
          cd build_asan
          # Decode-suite tests run now that fixtures exist. product_workflow_gate
          # is a PowerShell orchestration script and product_browse_tests is a
          # wall-clock UI-responsiveness check. crashhandler_tests raises a
          # deliberate SEH exception; ASan installs its own unhandled-exception
          # hook, so the product minidump handler never runs (the test stays in
          # the PR Gate suite). bench_* budgets are meaningless under ASan.
          $excludeRegex = "product_workflow_gate|product_browse_tests|crashhandler_tests|bench_"
          ctest --output-on-failure -j4 -E $excludeRegex

  # ---------------------------------------------------------------------------
  # asan-linux — AddressSanitizer + LeakSanitizer via native Linux GCC
  # Fast, native sanitizer verification without Windows-specific runtime thunks.
  # ---------------------------------------------------------------------------
  asan-linux:
    name: ASan / LSan (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Qt itself comes from install-qt-action (6.8, with image-format
          # plugins). These are the system libs the 6.8 gcc_64 build loads for
          # the offscreen platform. xcb-only packages (libxkbcommon-x11-0,
          # libxcb-cursor0) are not required: tests set QT_QPA_PLATFORM=offscreen.
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libx11-6 \
            cmake ninja-build g++

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Configure (GCC + ASan/UBSan)
        run: |
          cmake -B build_asan_linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (ASan)
        run: cmake --build build_asan_linux -j 4

      - name: Generate testdata fixtures
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 testdata/generate_fixtures.py --size 256x256
          python3 testdata/generate_large_fixtures.py --ensure

      - name: Test (ASan + LeakSanitizer)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export ASAN_OPTIONS="detect_leaks=1:detect_odr_violation=0"
          # UBSan otherwise prints "runtime error" with no stack.
          export UBSAN_OPTIONS="print_stacktrace=1"
          cd build_asan_linux
          # golden_image is a UI pixel diff; bench_* budgets are meaningless
          # under instrumentation. crashhandler_tests is built on Linux but the
          # deliberate crash is Windows SEH / minidump (and ASan intercepts it).
          # The rest are PowerShell script gates (COMMAND powershell in
          # src/CMakeLists.txt); Linux runners have no powershell.
          ctest --output-on-failure -j 4 -E "golden_image|bench_|crashhandler_tests|version_consistency|build_test_exit_gate|architecture_gate_regression|complexity_gate_regression|script_encoding_regression|release_version_tests|release_contract_tests|manual_acceptance_tests|product_workflow_gate"

  # ---------------------------------------------------------------------------
  # ubsan — UndefinedBehaviorSanitizer via clang-cl
  # ---------------------------------------------------------------------------
  ubsan:
    name: UBSan (clang-cl)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM
        id: llvm
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure (clang-cl + UBSan)
        run: |
          # Trap mode needs no ubsan runtime. The static standalone lib is
          # MT_StaticRelease and mismatches /MD, and lld-link rejects
          # -fsanitize=undefined. vptr/function cannot trap, so they are off.
          # 128-bit division (test_m3m4m5 makePattern) still calls __udivti3,
          # which is in clang_rt.builtins, not the ubsan runtime. /DEBUG writes
          # PDBs so failures are not just exe+offset.
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $ubsanLib = "$llvmShort/lib/clang/21/lib/windows"
          cmake -S . -B build_ubsan -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_PREFIX_PATH="$Env:Qt6_DIR/../.." `
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG /libpath:$ubsanLib clang_rt.builtins-x86_64.lib" `
            "-DCMAKE_SHARED_LINKER_FLAGS=/DEBUG /libpath:$ubsanLib clang_rt.builtins-x86_64.lib" `
            -DCMAKE_CXX_FLAGS="/MD /EHsc -fsanitize=undefined -fsanitize-trap=all -fno-sanitize=vptr,function -g"

      - name: Build (UBSan)
        run: cmake --build build_ubsan -j 4

      - name: Deploy Qt image plugins for UBSan tests
        run: |
          $pluginSrc = "$env:QT_PLUGIN_PATH\imageformats"
          $pluginDst = "build_ubsan\bin\imageformats"
          New-Item -ItemType Directory -Force -Path $pluginDst | Out-Null
          Copy-Item "$pluginSrc\*.dll" $pluginDst -Force

      - name: Generate testdata fixtures
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python testdata/generate_fixtures.py --size 256x256
          python testdata/generate_large_fixtures.py --ensure

      - name: Test (UBSan)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $env:PATH = "$llvmShort\bin;$llvmShort\lib\clang\21\lib\windows;$env:PATH"
          $env:UBSAN_OPTIONS = "print_stacktrace=1:halt_on_error=1"
          cd build_ubsan
          # Decode-suite tests run now that fixtures exist. product_workflow_gate
          # is a PowerShell script gate; product_browse_tests is a wall-clock
          # UI-responsiveness check. bench_* budgets are meaningless under
          # UBSan (bench_smoke alone was about a minute).
          $excludeRegex = "product_workflow_gate|product_browse_tests|bench_"
          ctest --output-on-failure -j4 -E $excludeRegex

      - name: Locate UBSan traps (diagnostic)
        # Trap mode prints nothing, so ctest only says "Illegal". Re-run the
        # first few failing tests under cdb and print the stack at the ud2.
        if: failure()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "cdb.exe not found"; exit 0 }
          $failed = "build_ubsan\Testing\Temporary\LastTestsFailed.log"
          if (-not (Test-Path $failed)) { Write-Host "no failed-test log"; exit 0 }
          $env:QT_QPA_PLATFORM = "offscreen"
          $tests = (ctest --test-dir build_ubsan --show-only=json-v1 | ConvertFrom-Json).tests
          $names = Get-Content $failed | ForEach-Object { ($_ -split ':', 2)[1] } | Select-Object -First 8
          foreach ($n in $names) {
            $t = $tests | Where-Object { $_.name -eq $n } | Select-Object -First 1
            if (-not $t -or -not $t.command) { continue }
            $exe = $t.command[0]
            $testArgs = @($t.command | Select-Object -Skip 1)
            $wd = ($t.properties | Where-Object { $_.name -eq "WORKING_DIRECTORY" }).value
            if (-not $wd) { $wd = Split-Path $exe }
            Write-Host "::group::$n"
            Push-Location $wd
            & $cdb -g -G -y (Split-Path $exe) -c ".lines -e; kn 30; ub @rip L20; u @rip L2; r; q" $exe @testArgs 2>&1 |
              Select-String -Pattern 'Illegal instruction|Access violation|^[0-9a-f]{2} |^[0-9a-f]{8}`[0-9a-f]{8} |^r[a-z0-9]+=|^[A-Za-z_!:<>+0-9 ]+:$' |
              Select-Object -First 70 | ForEach-Object { Write-Host $_.Line }
            Pop-Location
            Write-Host "::endgroup::"
          }

  # ---------------------------------------------------------------------------
  # clazy — Qt-aware static analysis (ubuntu, ADVISORY signal for nightly)
  # ---------------------------------------------------------------------------
  clazy:
    name: Static analysis (clazy, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clazy + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clazy clang clang-tools cmake ninja-build qt6-base-dev

      - name: Configure (clazy build)
        run: |
          cmake -S . -B build_clazy \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clazy \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build with clazy (advisory)
        run: |
          cmake --build build_clazy -j 4 2> clazy.txt || true
          echo "clazy run complete (advisory)"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clazy-findings-nightly
          path: clazy.txt

  # ---------------------------------------------------------------------------
  # quality — MSVC build + benchmark perf hard-gate + golden-image UI regression
  # Covers the architect's project-specific gates (Decode / Thumbnail / Cache
  # Hit / Compare / GPU Upload / Memory Peak) which are implemented as
  # mviewer_bench scenarios B1-B15.
  # ---------------------------------------------------------------------------
  quality:
    name: Benchmark + Golden Image (MSVC)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats   # qtiff.dll for golden/M3-M5 image tests
          cache: true

      - name: Build + Test (includes bench_enforce perf hard-gate + golden_image)
        run: |
          # testdata/ is git-ignored and regenerated by testdata_generator_gate;
          # Pillow is required to generate the JPEG/TIFF fixtures on a clean runner.
          python -m pip install --quiet --disable-pip-version-check Pillow
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Test

      - name: Benchmark regression vs baseline (alert on >10%)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $b = Get-ChildItem build_msvc -Recurse -Include mviewer_bench.exe,benchmark.exe | Select-Object -First 1
          if (-not $b) { Write-Host "::error:: benchmark binary not found"; exit 1 }
          # --enforce loads the committed baseline and enables the ±10% regression
          # diff (main.cpp: requires --enforce AND --regression to diff baseline).
          # Nightly compares against the committed CI-profile baseline. The PR
          # gate uses --profile auto, while this trend job remains stable when
          # the hosted runner's exposed core count changes.
          & $b.FullName --enforce --regression --profile ci --budget benchmark/performance_budget.json 2>&1 | Tee-Object -FilePath benchmark_regression.txt
        # Exit non-zero on >10% regression -> alerts the nightly run.
        # (golden_image is already verified inside `build.ps1 Test` above.)

      - name: Upload benchmark + golden reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quality-report
          path: |
            benchmark_regression.txt
            build_msvc/benchmark_report.json
            golden/difference/

  # ---------------------------------------------------------------------------
  # perfetto — capture a Chrome-trace JSON under instrumentation (best-effort).
  # Best-effort: depended-on tooling/flush trigger may need follow-up tuning;
  # it must never block the nightly aggregate.
  # ---------------------------------------------------------------------------
  perfetto:
    name: Perfetto trace capture (best-effort)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure (MVIEWER_ENABLE_PERFETTO=ON)
        run: |
          cmake -S . -B build_perf -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$Env:Qt6_DIR/../.." `
            -DMVIEWER_ENABLE_PERFETTO=ON

      - name: Build (perfetto)
        run: cmake --build build_perf -j 4

      - name: Run smoke + flush Chrome trace JSON
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          cd build_perf
          $b = Get-ChildItem . -Recurse -Include mviewer_bench.exe | Select-Object -First 1
          if (-not $b) { Write-Host "mviewer_bench.exe not found"; exit 1 }
          # --trace flushes a Chrome trace JSON at exit (only meaningful when built
          # with MVIEWER_ENABLE_PERFETTO, which this build dir is).
          & $b.FullName --smoke --trace mviewer_trace.json

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfetto-trace
          path: '**/mviewer_trace.json'

  # ---------------------------------------------------------------------------
  # coverage — per-module line coverage via OpenCppCoverage (MSVC PDB based).
  # Advisory for now (continue-on-error); target thresholds per QUALITY.md:
  # Core >= 85%. Produces coverage.json {core, ui, compare, overall} consumed
  # by scripts/health_score.ps1 -CoverageJson so the nightly dashboard includes
  # a Coverage dimension.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (OpenCppCoverage, advisory)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Build (Release)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: Generate testdata fixtures
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python testdata/generate_fixtures.py --size 256x256

      - name: Run ctest under OpenCppCoverage (cobertura)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;C:\Program Files\OpenCppCoverage;" + $env:PATH
          cd build_msvc
          # crashhandler_tests launches a child that deliberately crashes.
          # Under OpenCppCoverage --cover_children that child cannot run, so
          # the test fails in ~30s. It stays in the normal (non-coverage) suite.
          # bench_* perf budgets are meaningless under coverage instrumentation.
          OpenCppCoverage.exe `
            --export_type cobertura:coverage.xml `
            --export_type html:coverage_html `
            --sources "$env:GITHUB_WORKSPACE\src" `
            --excluded_sources "$env:GITHUB_WORKSPACE\src\benchmark" `
            --cover_children `
            -- ctest --output-on-failure -j2 -E "crashhandler_tests|bench_"
          if (-not (Test-Path coverage.xml)) { Write-Host "::warning:: coverage.xml not produced"; exit 1 }

      - name: Per-module coverage summary + dashboard
        # Test failures must not hide the coverage numbers: summarise whenever
        # OpenCppCoverage produced a report.
        if: ${{ !cancelled() && hashFiles('build_msvc/coverage.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$cov = Get-Content build_msvc/coverage.xml -Raw
          $mods = @{ core = @(0,0); ui = @(0,0); compare = @(0,0); all = @(0,0) }
          foreach ($cls in $cov.SelectNodes('//class')) {
            $fn = $cls.filename -replace '/', '\'
            $m = 'ui'
            if ($fn -match '\\core\\' -or $fn -match '\\domain\\') { $m = 'core' }
            elseif ($fn -match 'compare') { $m = 'compare' }
            foreach ($line in $cls.SelectNodes('.//line')) {
              $hit = [int]$line.hits -gt 0
              foreach ($k in @($m, 'all')) {
                $mods[$k][1]++
                if ($hit) { $mods[$k][0]++ }
              }
            }
          }
          function Pct($a) { if ($a[1] -eq 0) { return 0 } [math]::Round(100.0 * $a[0] / $a[1], 1) }
          $out = [ordered]@{
            core = Pct $mods.core; ui = Pct $mods.ui
            compare = Pct $mods.compare; overall = Pct $mods.all
          }
          $out | ConvertTo-Json | Set-Content coverage.json -Encoding UTF8
          Get-Content coverage.json
          # Core coverage target (QUALITY.md): >= 85% — advisory warning for now
          if ($out.core -lt 85) { Write-Host "::warning:: Core coverage $($out.core)% is below the 85% target" }
          ./scripts/health_score.ps1 -CoverageJson coverage.json
          Get-Content docs/quality/dashboard.md | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: |
            build_msvc/coverage.xml
            build_msvc/coverage_html
            coverage.json
            docs/quality/dashboard.md

  # ---------------------------------------------------------------------------
  # publish-health — M23: commit auto-generated quality artifacts back to master
  # (Tier-2 enforcement tier). Runs health_score + benchmark_trend + test_matrix
  # from the nightly quality/coverage results and COMMITS docs/quality/*,
  # docs/test_matrix.md, docs/known_issues/*, benchmark/report/* so project
  # health is always current without any human editing the Markdown.
  # Only runs on the scheduled trigger and uses [skip ci] to avoid re-triggering
  # Tier-1.
  # ---------------------------------------------------------------------------
  publish-health:
    name: Publish health (auto-commit quality docs)
    runs-on: ubuntu-latest
    needs: [quality, coverage]
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - name: Checkout (push token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download nightly quality report
        uses: actions/download-artifact@v4
        with:
          name: nightly-quality-report
          path: .

      - name: Download nightly coverage
        uses: actions/download-artifact@v4
        with:
          name: nightly-coverage
          path: .

      - name: Health score + dashboard
        shell: pwsh
        run: ./scripts/health_score.ps1 -CoverageJson coverage.json -BenchmarkJson build_msvc/benchmark_report.json

      - name: Append benchmark trend + render sparklines
        shell: pwsh
        run: ./scripts/benchmark_trend.ps1 -BenchmarkJson build_msvc/benchmark_report.json

      - name: Regenerate test matrix
        shell: pwsh
        run: ./scripts/test_matrix.ps1

      - name: Commit generated quality artifacts
        run: |
          git config user.name "mviewer-bot"
          git config user.email "bot@mviewer.local"
          git add docs/quality/ docs/test_matrix.md docs/known_issues/
          # trend.json / index.html are produced only when a benchmark report
          # exists. git add -f of a missing pathspec fails the publish step.
          for f in benchmark/report/trend.json benchmark/report/index.html; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "health: nothing to commit"
          else
            git commit -m "auto: M23 health publish — dashboard / trend / test-matrix [skip ci]"
            git push
          fi

