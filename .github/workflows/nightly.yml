# =============================================================================
# MViewer CI — TIER 2: Nightly (scheduled, heavy, NON-blocking for PRs)
# -----------------------------------------------------------------------------
# Runs once per day (and on manual dispatch). Covers the slow, environment-
# sensitive checks that must NOT sit in the PR gate:
#   * ASan  — out-of-bounds / use-after-free / heap overflow (+ leak detect)
#   * UBSan — integer overflow / undefined behaviour (alignment off on clang-cl trap)
#   * fuzz  — libFuzzer on the EXIF/TIFF/RAW/Y4M/YUV parsers (Linux clang)
#   * clazy — Qt-aware static analysis (advisory signal)
#   * quality — CTest bench_* perf hard-gate + golden_image UI regression
#   * perfetto — capture a Chrome-trace JSON under instrumentation (best-effort)
#
# Findings here are alerts, not merge blockers. They raise long-term signal
# without hurting PR velocity. The aggregator `qa-report` is the entry point
# for the nightly QA summary / dashboards.
#
# Reference docs: docs/acceptance/M13.3_perf_budget_gate.md,
#                 docs/acceptance/M13.5_perfetto.md,
#                 docs/known_issues/MSVC_ASAN.md
# =============================================================================

name: Nightly (Tier 2)

on:
  schedule:
    # 02:13 UTC daily — off the top of the hour to avoid runner contention.
    - cron: '13 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# Review P2-12: read-only token by default. actions: read lets the quality job
# list earlier nightly runs for the rolling benchmark baseline. publish-health
# raises contents: write for itself only.
permissions:
  contents: read
  actions: read

# Review P2-11: nightly builds must never silently drop RAW demosaic.
env:
  MVIEWER_REQUIRE_LIBRAW: "ON"

jobs:
  # ---------------------------------------------------------------------------
  # asan — AddressSanitizer (+ LeakSanitizer is built into ASan) via clang-cl
  # ---------------------------------------------------------------------------
  asan:
    name: ASan / LSan (clang-cl)
    runs-on: windows-2022
    # MSVC configure+build is about 40 min. 180 covers that plus the suite so
    # one hung test cannot hold the nightly concurrency group for 6 h.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Setup MSVC (Windows headers/libs for clang-cl)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install LLVM (clang-cl + llvm-symbolizer)
        id: llvm
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          # 22.x carries llvm-project#159618: catch-block parameters are no
          # longer ASan-instrumented on Windows. 21.x reports a bogus
          # access-violation inside every `catch (const T &e)` that touches e
          # (google/sanitizers#749). The action's asset table stops at 21.1.8.
          version: "22.1.8"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure (clang-cl + ASan)
        run: |
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $asanLib = "$llvmShort/lib/clang/22/lib/windows"
          cmake -S . -B build_asan -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_PREFIX_PATH="$Env:Qt6_DIR/../.." `
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG -fsanitize=address /libpath:$asanLib clang_rt.asan_dynamic-x86_64.lib clang_rt.asan_dynamic_runtime_thunk-x86_64.lib" `
            "-DCMAKE_SHARED_LINKER_FLAGS=/DEBUG -fsanitize=address /libpath:$asanLib clang_rt.asan_dynamic-x86_64.lib clang_rt.asan_dynamic_runtime_thunk-x86_64.lib" `
            -DCMAKE_CXX_FLAGS="/MD /EHsc -fsanitize=address -g"

      - name: Build (ASan)
        run: cmake --build build_asan -j 4

      - name: Deploy Qt image plugins for ASan tests
        run: |
          $pluginSrc = "$env:QT_PLUGIN_PATH\imageformats"
          $pluginDst = "build_asan\bin\imageformats"
          New-Item -ItemType Directory -Force -Path $pluginDst | Out-Null
          Copy-Item "$pluginSrc\*.dll" $pluginDst -Force

      - name: Generate testdata fixtures
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python testdata/generate_fixtures.py --size 256x256
          python testdata/generate_large_fixtures.py --ensure

      - name: Test (ASan + LeakSanitizer)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $env:PATH = "$llvmShort\bin;$llvmShort\lib\clang\22\lib\windows;$env:PATH"
          # detect_leaks is unsupported on Windows and aborts every test at
          # startup. The Linux GCC job below keeps detect_leaks=1.
          # symbolize=1 plus llvm-symbolizer: without PDBs (/DEBUG above) and
          # a symbolizer, frames are exe+offset or the nearest DLL export.
          $env:ASAN_OPTIONS = "detect_odr_violation=0:symbolize=1"
          $env:ASAN_SYMBOLIZER_PATH = "$llvmShort\bin\llvm-symbolizer.exe"
          cd build_asan
          # Decode-suite tests run now that fixtures exist. product_workflow_gate
          # is a PowerShell orchestration script and product_browse_tests is a
          # wall-clock UI-responsiveness check. crashhandler_tests raises a
          # deliberate SEH exception; ASan installs its own unhandled-exception
          # hook, so the product minidump handler never runs (the test stays in
          # the PR Gate suite). bench_* budgets are meaningless under ASan.
          $excludeRegex = "product_workflow_gate|product_browse_tests|crashhandler_tests|bench_"
          ctest --output-on-failure -j4 --timeout 600 -E $excludeRegex

  # ---------------------------------------------------------------------------
  # asan-linux — AddressSanitizer + LeakSanitizer via native Linux GCC
  # Fast, native sanitizer verification without Windows-specific runtime thunks.
  # ---------------------------------------------------------------------------
  asan-linux:
    name: ASan / LSan (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        # ~1250 ASan+UBSan Debug targets each statically link libmviewer_ui.a;
        # Nightly 41702768688 died in the link step with "No space left on
        # device" (30 MB free). Drop preinstalled toolchains this job never
        # uses (.NET, Android SDK, GHC, CodeQL, Swift) and cached docker images.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Qt itself comes from install-qt-action (6.8, with image-format
          # plugins). These are the system libs the 6.8 gcc_64 build loads for
          # the offscreen platform. xcb-only packages (libxkbcommon-x11-0,
          # libxcb-cursor0) are not required: tests set QT_QPA_PLATFORM=offscreen.
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libegl1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libx11-6 \
            cmake ninja-build g++

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Configure (GCC + ASan/UBSan)
        run: |
          cmake -B build_asan_linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g1" \
            -DCMAKE_CXX_FLAGS_DEBUG="-g1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (ASan)
        # -g1 (line tables only) keeps file:line in sanitizer stacks while
        # cutting per-binary debug info several-fold; full -g ran the disk out.
        run: |
          cmake --build build_asan_linux -j 4
          df -h /

      - name: Generate testdata fixtures
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 testdata/generate_fixtures.py --size 256x256
          python3 testdata/generate_large_fixtures.py --ensure

      - name: Test (ASan + LeakSanitizer)
        # Bound a hung test so the job reports instead of holding the nightly
        # concurrency group for the 6 h default.
        timeout-minutes: 90
        run: |
          export QT_QPA_PLATFORM=offscreen
          export ASAN_OPTIONS="detect_leaks=1:detect_odr_violation=0"
          # UBSan otherwise prints "runtime error" with no stack.
          export UBSAN_OPTIONS="print_stacktrace=1"
          cd build_asan_linux
          # golden_image is a UI pixel diff; bench_* budgets are meaningless
          # under instrumentation. crashhandler_tests is built on Linux but the
          # deliberate crash is Windows SEH / minidump (and ASan intercepts it).
          # The rest are PowerShell script gates (COMMAND powershell in
          # src/CMakeLists.txt); Linux runners have no powershell.
          ctest --output-on-failure -j 4 --timeout 600 -E "golden_image|bench_|crashhandler_tests|version_consistency|build_test_exit_gate|architecture_gate_regression|adr_gate_regression|complexity_gate_regression|script_encoding_regression|release_version_tests|release_contract_tests|manual_acceptance_tests|product_workflow_gate"

  # ---------------------------------------------------------------------------
  # fuzz-linux — libFuzzer + ASan/UBSan on the hand-written binary parsers
  # (review P1-5): TIFF/RAW IFD walker, JPEG EXIF/GPS/ICC scrapers, Y4M
  # headers/frame index, raw-YUV name inference. ~5 min of fuzzing in total.
  # Seeds live in tests/fuzz/corpus/<target>; CTest replays them on every PR.
  # A crash uploads its reproducer: add it to the seed corpus with the fix.
  # ---------------------------------------------------------------------------
  fuzz-linux:
    name: Fuzz parsers (Linux clang libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgl1-mesa-dev libxkbcommon-dev libegl1 \
            libfontconfig1 libfreetype6 libdbus-1-3 libx11-6 cmake ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Configure (clang + libFuzzer + ASan/UBSan)
        run: |
          cmake -B build_fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DMVIEWER_FUZZ=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,fuzzer-no-link -fno-omit-frame-pointer -g1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build fuzz targets
        run: |
          cmake --build build_fuzz -j 4 --target \
            fuzz_raw_metadata fuzz_exif_reader fuzz_y4m fuzz_yuv_inference

      - name: Fuzz (75 s per target)
        run: |
          export QT_QPA_PLATFORM=offscreen
          export ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          mkdir -p fuzz-artifacts
          status=0
          for t in fuzz_raw_metadata fuzz_exif_reader fuzz_y4m fuzz_yuv_inference; do
            mkdir -p "fuzz-work/$t"
            cp tests/fuzz/corpus/$t/* "fuzz-work/$t/"
            echo "::group::$t"
            build_fuzz/bin/$t "fuzz-work/$t" -max_total_time=75 -rss_limit_mb=2048 \
              -timeout=10 -artifact_prefix="fuzz-artifacts/$t-" -print_final_stats=1 || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/

  # ---------------------------------------------------------------------------
  # ubsan — UndefinedBehaviorSanitizer via clang-cl
  # ---------------------------------------------------------------------------
  ubsan:
    name: UBSan (clang-cl)
    runs-on: windows-2022
    # Same bound as the Windows ASan job: build is about 40 min, tests the rest.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install LLVM
        id: llvm
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          # 22.x emits UBSan trap reasons into debug info (an artificial
          # __clang_trap_msg$... inline frame), so cdb names the failed check.
          version: "22.1.8"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure (clang-cl + UBSan)
        run: |
          # Trap mode needs no ubsan runtime. The static standalone lib is
          # MT_StaticRelease and mismatches /MD, and lld-link rejects
          # -fsanitize=undefined. vptr/function cannot trap, so they are off.
          # alignment is also off: clang-cl + Qt QCallableObject (lambda/PMF
          # connect and QTimer::singleShot) emits test-al-0Fh / ud2 when the
          # slot object is constructed under -fsanitize-trap=all, which made
          # most UI suites Illegal on Nightly (compare_*/usm/rotate/m46/...).
          # 128-bit division (test_m3m4m5 makePattern) still calls __udivti3,
          # which is in clang_rt.builtins, not the ubsan runtime. /DEBUG writes
          # PDBs so failures are not just exe+offset.
          # -fno-sanitize-merge: Release otherwise folds every check of one kind
          # into a single ud2 per function, so the cdb stack points at an
          # unrelated line. Unique traps keep the real source location + reason.
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $ubsanLib = "$llvmShort/lib/clang/22/lib/windows"
          # object-size is ignored only inside Qt's qobjectdefs_impl.h: under the
          # MSVC ABI QCallableObject's empty functor base sits at offset
          # sizeof(object), so every captureless-lambda connect got a static
          # ud1 (kind 22). See ci/ubsan-qt-ignorelist.txt.
          $ubsanIgnore = ("${{ github.workspace }}/ci/ubsan-qt-ignorelist.txt" -replace '\\','/')
          cmake -S . -B build_ubsan -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DCMAKE_PREFIX_PATH="$Env:Qt6_DIR/../.." `
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG /libpath:$ubsanLib clang_rt.builtins-x86_64.lib" `
            "-DCMAKE_SHARED_LINKER_FLAGS=/DEBUG /libpath:$ubsanLib clang_rt.builtins-x86_64.lib" `
            -DCMAKE_CXX_FLAGS="/MD /EHsc -fsanitize=undefined -fsanitize-trap=all -fno-sanitize=vptr,function,alignment -fno-sanitize-merge=all -fsanitize-ignorelist=$ubsanIgnore -g"

      - name: Build (UBSan)
        run: cmake --build build_ubsan -j 4

      - name: Deploy Qt image plugins for UBSan tests
        run: |
          $pluginSrc = "$env:QT_PLUGIN_PATH\imageformats"
          $pluginDst = "build_ubsan\bin\imageformats"
          New-Item -ItemType Directory -Force -Path $pluginDst | Out-Null
          Copy-Item "$pluginSrc\*.dll" $pluginDst -Force

      - name: Generate testdata fixtures
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python testdata/generate_fixtures.py --size 256x256
          python testdata/generate_large_fixtures.py --ensure

      - name: Test (UBSan)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $llvmShort = (New-Object -ComObject Scripting.FileSystemObject).GetFolder("${{ env.LLVM_PATH }}").ShortPath
          $env:PATH = "$llvmShort\bin;$llvmShort\lib\clang\22\lib\windows;$env:PATH"
          $env:UBSAN_OPTIONS = "print_stacktrace=1:halt_on_error=1"
          cd build_ubsan
          # Decode-suite tests run now that fixtures exist. product_workflow_gate
          # is a PowerShell script gate; product_browse_tests is a wall-clock
          # UI-responsiveness check. bench_* budgets are meaningless under
          # UBSan (bench_smoke alone was about a minute).
          $excludeRegex = "product_workflow_gate|product_browse_tests|bench_"
          ctest --output-on-failure -j4 --timeout 600 -E $excludeRegex

      - name: Locate UBSan traps (diagnostic)
        # Trap mode prints nothing, so ctest only says "Illegal". Re-run the
        # first few failing tests under cdb. clang's ud1 ModRM byte is the
        # UBSan check kind; a Select-String filter drops those faulting bytes.
        # Print rip, the surrounding disassembly, and the raw bytes, and keep
        # the full cdb transcript for the artifact upload below.
        if: failure()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { Write-Host "cdb.exe not found"; exit 0 }
          $failed = "build_ubsan\Testing\Temporary\LastTestsFailed.log"
          if (-not (Test-Path $failed)) { Write-Host "no failed-test log"; exit 0 }
          $logDir = Join-Path (Get-Location).Path "ubsan-cdb-logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $env:QT_QPA_PLATFORM = "offscreen"
          $tests = (ctest --test-dir build_ubsan --show-only=json-v1 | ConvertFrom-Json).tests
          $names = Get-Content $failed | ForEach-Object { ($_ -split ':', 2)[1] } | Select-Object -First 8
          foreach ($n in $names) {
            $t = $tests | Where-Object { $_.name -eq $n } | Select-Object -First 1
            if (-not $t -or -not $t.command) { continue }
            $exe = $t.command[0]
            $testArgs = @($t.command | Select-Object -Skip 1)
            $wd = ($t.properties | Where-Object { $_.name -eq "WORKING_DIRECTORY" }).value
            if (-not $wd) { $wd = Split-Path $exe }
            $safe = ($n -replace '[^A-Za-z0-9._-]', '_')
            $log = Join-Path $logDir "$safe.log"
            # r / u / db show the trap kind. db @rip is the faulting bytes
            # (ud1 immediate); u starts before rip in case the trap advanced it.
            $cmd = ".echo ===UBSAN_TRAP===; .lines -e; r; u @rip-0x10 L8; .echo ===UBSAN_BYTES===; db @rip L8; .echo ===UBSAN_STACK===; kb; q"
            Write-Host "::group::$n"
            Write-Host "full cdb log: $log"
            Push-Location $wd
            & $cdb -g -G -y (Split-Path $exe) -c $cmd $exe @testArgs *> $log
            Pop-Location
            if (Test-Path -LiteralPath $log) {
              $lines = @(Get-Content -LiteralPath $log)
              $start = 0
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '===UBSAN_TRAP===') { $start = $i; break }
              }
              if ($lines.Count -gt 0) {
                $lines[$start..($lines.Count - 1)] | ForEach-Object { Write-Host $_ }
              }
            }
            Write-Host "::endgroup::"
          }

      - name: Upload UBSan cdb logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubsan-cdb-logs
          path: ubsan-cdb-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # clazy — Qt-aware static analysis (ubuntu, ADVISORY signal for nightly)
  # ---------------------------------------------------------------------------
  clazy:
    name: Static analysis (clazy, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Install clazy + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clazy clang clang-tools cmake ninja-build qt6-base-dev

      - name: Configure (clazy build)
        run: |
          cmake -S . -B build_clazy \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=clazy \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build with clazy (advisory)
        run: |
          cmake --build build_clazy -j 4 2> clazy.txt || true
          echo "clazy run complete (advisory)"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clazy-findings-nightly
          path: clazy.txt

  # ---------------------------------------------------------------------------
  # quality — MSVC build + benchmark perf hard-gate + golden-image UI regression
  # Covers the architect's project-specific gates (Decode / Thumbnail / Cache
  # Hit / Compare / GPU Upload / Memory Peak) which are implemented as
  # mviewer_bench scenarios B1-B15.
  # ---------------------------------------------------------------------------
  quality:
    name: Benchmark + Golden Image (MSVC)
    runs-on: windows-2022
    # build.ps1 Test is an MSVC build (~40 min) plus the suite and a second
    # benchmark. Bound the job so a hang cannot hold the nightly slot for 6 h.
    # Per-test ctest timeout stays inside build.ps1 (not edited here).
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats   # qtiff.dll for golden/M3-M5 image tests
          cache: true

      - name: Build + Test (includes bench_enforce perf hard-gate + golden_image)
        run: |
          # testdata/ is git-ignored and regenerated by testdata_generator_gate;
          # Pillow is required to generate the JPEG/TIFF fixtures on a clean runner.
          python -m pip install --quiet --disable-pip-version-check Pillow
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Test

      - name: Benchmark samples (absolute budgets + 5 samples)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          # Prefer mviewer_bench only. Legacy benchmark.exe (benchmark_main.cpp)
          # ignores --enforce/--results and always exits 0.
          $b = Get-ChildItem build_msvc -Recurse -Filter mviewer_bench.exe | Select-Object -First 1
          if (-not $b) { Write-Host "::error:: mviewer_bench.exe not found under build_msvc"; exit 1 }
          Write-Host "Using $($b.FullName)"
          New-Item -ItemType Directory -Force bench_samples | Out-Null
          # Sample 1 enforces the absolute budgets (=== ALL PASS ===) exactly as
          # before; it no longer runs the single-sample +/-10% baseline diff.
          & $b.FullName --enforce --profile ci --budget benchmark/performance_budget.json --results bench_samples/run1.json 2>&1 | Tee-Object -FilePath benchmark_regression.txt
          $budgetExit = $LASTEXITCODE
          # Samples 2..5 only measure; the regression check uses the median.
          foreach ($i in 2..5) {
            & $b.FullName --profile ci --budget benchmark/performance_budget.json --results "bench_samples/run$i.json" 2>&1 | Out-File -Append benchmark_regression.txt
          }
          if ($budgetExit -ne 0) { Write-Host "::error:: absolute benchmark budgets failed"; exit $budgetExit }

      - name: Fetch rolling baseline (last green nightly benchmark reports)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Review P0-3: the baseline is the median of the last 5 nightly runs
          # whose quality job succeeded, not a hand-pinned point value.
          mkdir -p perf_history
          found=0
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow nightly.yml --limit 30 \
                        --json databaseId,status -q '.[] | select(.status=="completed") | .databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            ok=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs \
                   -q '.jobs[] | select(.name=="Benchmark + Golden Image (MSVC)") | .conclusion')
            [ "$ok" = "success" ] || continue
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n nightly-quality-report -D "perf_history/$id" >/dev/null 2>&1; then
              found=$((found+1))
            fi
            [ "$found" -ge 5 ] && break
          done
          echo "rolling baseline reports: $found"

      - name: Benchmark regression (median vs rolling baseline, report-only)
        if: ${{ !cancelled() }}
        run: |
          # --mode report: regressions are annotated warnings while the rolling
          # history fills up. Switch to --mode enforce once a week of green
          # nightlies exists (tracked in QUALITY.md, "Performance trend").
          python scripts/perf_regression.py --samples (Get-ChildItem bench_samples -Filter *.json | ForEach-Object FullName) `
            --history-dir perf_history --baseline benchmark/perf_baseline.json `
            --mode report --out build_msvc/benchmark_report.json --summary $env:GITHUB_STEP_SUMMARY 2>&1 | Tee-Object -Append -FilePath benchmark_regression.txt
          exit $LASTEXITCODE

      - name: Upload benchmark + golden reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-quality-report
          path: |
            benchmark_regression.txt
            build_msvc/benchmark_report.json
            bench_samples/
            golden/difference/

  # ---------------------------------------------------------------------------
  # perfetto — capture a Chrome-trace JSON under instrumentation (best-effort).
  # Best-effort: depended-on tooling/flush trigger may need follow-up tuning;
  # it must never block the nightly aggregate.
  # ---------------------------------------------------------------------------
  perfetto:
    name: Perfetto trace capture (best-effort)
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Configure (MVIEWER_ENABLE_PERFETTO=ON)
        run: |
          cmake -S . -B build_perf -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$Env:Qt6_DIR/../.." `
            -DMVIEWER_ENABLE_PERFETTO=ON

      - name: Build (perfetto)
        run: cmake --build build_perf -j 4

      - name: Run smoke + flush Chrome trace JSON
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          cd build_perf
          $b = Get-ChildItem . -Recurse -Include mviewer_bench.exe | Select-Object -First 1
          if (-not $b) { Write-Host "mviewer_bench.exe not found"; exit 1 }
          # --trace flushes a Chrome trace JSON at exit (only meaningful when built
          # with MVIEWER_ENABLE_PERFETTO, which this build dir is).
          & $b.FullName --smoke --trace mviewer_trace.json

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perfetto-trace
          path: '**/mviewer_trace.json'

  # ---------------------------------------------------------------------------
  # coverage — per-module line coverage via OpenCppCoverage (MSVC PDB based).
  # Advisory for now (continue-on-error); target thresholds per QUALITY.md:
  # Core >= 85%. Produces coverage.json {core, ui, compare, overall} consumed
  # by scripts/health_score.ps1 -CoverageJson so the nightly dashboard includes
  # a Coverage dimension.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (OpenCppCoverage, advisory)
    runs-on: windows-2022
    # Advisory, but still bounded: an instrumented hang must not occupy the
    # nightly concurrency group until the 6 h default.
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache LibRaw tag archive (review P2-11)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Build (Release, PDBs for every test executable)
        # OpenCppCoverage maps lines through PDBs. Release used to emit none
        # ("No modules were selected", 0% coverage). MVIEWER_ALL_PDBS makes
        # CMakeLists.txt link every executable with /DEBUG (review P0-4).
        env:
          MVIEWER_ALL_PDBS: "ON"
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: Generate testdata fixtures
        run: |
          python -m pip install --quiet --disable-pip-version-check Pillow
          python testdata/generate_fixtures.py --size 256x256

      - name: Run ctest under OpenCppCoverage (cobertura)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin;C:\Program Files\OpenCppCoverage;" + $env:PATH
          cd build_msvc
          # crashhandler_tests launches a child that deliberately crashes.
          # Under OpenCppCoverage --cover_children that child cannot run, so
          # the test fails in ~30s. It stays in the normal (non-coverage) suite.
          # bench_* perf budgets are meaningless under coverage instrumentation.
          # product_browse_tests / product_workflow_gate assert wall-clock UI
          # budgets that OpenCppCoverage --cover_children blows past
          # (advisory Coverage). Same exclusion as ASan/UBSan.
          OpenCppCoverage.exe `
            --export_type cobertura:coverage.xml `
            --export_type html:coverage_html `
            --sources "$env:GITHUB_WORKSPACE\src" `
            --excluded_sources "$env:GITHUB_WORKSPACE\src\benchmark" `
            --cover_children `
            -- ctest --output-on-failure -j2 --timeout 600 -E "crashhandler_tests|bench_|product_workflow_gate|product_browse_tests"
          if (-not (Test-Path coverage.xml)) { Write-Host "::warning:: coverage.xml not produced"; exit 1 }

      - name: Per-module coverage summary + dashboard
        # Test failures must not hide the coverage numbers: summarise whenever
        # OpenCppCoverage produced a report.
        if: ${{ !cancelled() && hashFiles('build_msvc/coverage.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$cov = Get-Content build_msvc/coverage.xml -Raw
          $mods = @{ core = @(0,0); ui = @(0,0); compare = @(0,0); all = @(0,0) }
          foreach ($cls in $cov.SelectNodes('//class')) {
            $fn = $cls.filename -replace '/', '\'
            $m = 'ui'
            if ($fn -match '\\core\\' -or $fn -match '\\domain\\') { $m = 'core' }
            elseif ($fn -match 'compare') { $m = 'compare' }
            foreach ($line in $cls.SelectNodes('.//line')) {
              $hit = [int]$line.hits -gt 0
              foreach ($k in @($m, 'all')) {
                $mods[$k][1]++
                if ($hit) { $mods[$k][0]++ }
              }
            }
          }
          function Pct($a) { if ($a[1] -eq 0) { return 0 } [math]::Round(100.0 * $a[0] / $a[1], 1) }
          $out = [ordered]@{
            core = Pct $mods.core; ui = Pct $mods.ui
            compare = Pct $mods.compare; overall = Pct $mods.all
          }
          $out | ConvertTo-Json | Set-Content coverage.json -Encoding UTF8
          Get-Content coverage.json
          # Core coverage target (QUALITY.md): >= 85% — advisory warning for now
          if ($out.core -lt 85) { Write-Host "::warning:: Core coverage $($out.core)% is below the 85% target" }
          ./scripts/health_score.ps1 -CoverageJson coverage.json
          Get-Content docs/quality/dashboard.md | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-coverage
          path: |
            build_msvc/coverage.xml
            build_msvc/coverage_html
            coverage.json
            docs/quality/dashboard.md

  # ---------------------------------------------------------------------------
  # publish-health — M23: commit auto-generated quality artifacts back to master
  # (Tier-2 enforcement tier). Runs health_score + benchmark_trend + test_matrix
  # from the nightly quality/coverage results and COMMITS docs/quality/*,
  # docs/test_matrix.md, docs/known_issues/*, benchmark/report/* so project
  # health is always current without any human editing the Markdown.
  # Only runs on the scheduled trigger and uses [skip ci] to avoid re-triggering
  # Tier-1.
  # ---------------------------------------------------------------------------
  publish-health:
    name: Publish health (auto-commit quality docs)
    runs-on: ubuntu-latest
    needs: [quality, coverage]
    # Schedule only. A custom if replaces the implicit success() check, so
    # name quality explicitly: a red quality job must not commit the dashboard.
    # coverage stays advisory (continue-on-error) and is not required here.
    if: ${{ github.event_name == 'schedule' && needs.quality.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout (push token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download nightly quality report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-quality-report
          path: .

      - name: Download nightly coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-coverage
          path: .

      - name: Health score + dashboard
        shell: pwsh
        run: ./scripts/health_score.ps1 -CoverageJson coverage.json -BenchmarkJson build_msvc/benchmark_report.json

      - name: Append benchmark trend + render sparklines
        shell: pwsh
        run: ./scripts/benchmark_trend.ps1 -BenchmarkJson build_msvc/benchmark_report.json

      - name: Regenerate test matrix
        shell: pwsh
        run: ./scripts/test_matrix.ps1

      - name: Commit generated quality artifacts
        run: |
          git config user.name "mviewer-bot"
          git config user.email "bot@mviewer.local"
          git add docs/quality/ docs/test_matrix.md docs/known_issues/
          # trend.json / index.html are produced only when a benchmark report
          # exists. git add -f of a missing pathspec fails the publish step.
          for f in benchmark/report/trend.json benchmark/report/index.html; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "health: nothing to commit"
          else
            git commit -m "auto: M23 health publish — dashboard / trend / test-matrix [skip ci]"
            # master can move while the nightly runs (a PR merged mid-run made
            # 2026-10-30 fail as non-fast-forward). Rebase the generated-docs
            # commit onto the latest master and retry; a real conflict aborts.
            branch="${GITHUB_REF_NAME:-master}"
            for attempt in 1 2 3 4 5; do
              if git push origin "HEAD:${branch}"; then
                echo "health: published (attempt ${attempt})"
                exit 0
              fi
              echo "health: push rejected (attempt ${attempt}); rebasing onto origin/${branch}"
              git fetch origin "${branch}"
              if ! git rebase "origin/${branch}"; then
                git rebase --abort || true
                echo "::error::health publish: rebase onto origin/${branch} conflicted"
                exit 1
              fi
              sleep $((attempt * 5))
            done
            echo "::error::health publish: push still rejected after 5 attempts"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # qa-report — nightly aggregator / entry point for QA dashboards
  # ---------------------------------------------------------------------------
  qa-report:
    name: QA report (Tier 2)
    runs-on: ubuntu-latest
    needs: [asan, asan-linux, fuzz-linux, ubsan, clazy, quality, perfetto, coverage]
    if: always()
    steps:
      - name: Nightly summary
        run: |
          echo "Nightly Tier-2 completed."
          echo "Artifacts: clang-tidy-findings (n/a), clazy-findings-nightly, nightly-quality-report, perfetto-trace"
          echo "Check the uploaded artifacts for ASan/UBSan leaks, perf regression, golden diffs, and the Perfetto trace."
