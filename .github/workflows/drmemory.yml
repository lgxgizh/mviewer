# Standalone tooling validation: never tags, packages or publishes releases.
name: Dr.Memory tooling validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/drmemory/**'
      - '.github/workflows/drmemory.yml'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: drmemory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Dr.Memory deterministic contracts
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: ./scripts/drmemory/test.ps1
  actual-execution:
    # Optional diagnostic, intentionally not a required PR/release gate.
    # Unlike release's job-level best-effort, standalone validation is red on
    # unknown/errors: its successful execution must never imply memory clean.
    name: Dr.Memory actual execution (advisory)
    needs: contracts
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      MVIEWER_REQUIRE_LIBRAW: 'ON'
      # Release normally writes linker PDBs only for shipping binaries.
      # Dr.Memory also needs core_tests.pdb for actionable target frames.
      MVIEWER_ALL_PDBS: 'ON'
      SCCACHE_GHA_ENABLED: 'true'
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/LibRaw-*.tar.gz
          key: libraw-${{ hashFiles('cmake/LibRaw.cmake') }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
      - name: Build representative core tests (Release with PDBs)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release
      - name: Actual Dr.Memory execution and report verification
        shell: pwsh
        timeout-minutes: 8
        run: ./scripts/drmemory/run.ps1 -EvidenceRoot "drmemory_out/Windows path with spaces"
      - name: Retain real output and reports even when unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drmemory-evidence
          path: drmemory_out/
          if-no-files-found: error
