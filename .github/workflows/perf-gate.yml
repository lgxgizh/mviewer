name: Perf Gate

# M13.3 — Performance Budget as a HARD CI gate (product力 #2 "稳得住").
#
# Runs `mviewer_bench --enforce --budget benchmark/performance_budget.json`.
# This job FAILS the PR when any of the B1-B9 + B11-B15 hard budgets in
# performance_budget.json is violated. The budgets are generous,
# cross-machine-STABLE absolute caps, so this never fails on CI hardware jitter.
#
# The noisier baseline-REGRESSION diff (vs the machine-specific perf_baseline.json)
# is a SEPARATE axis run by nightly.yml (`--regression`), NOT by this mandatory
# gate — otherwise the committed baseline (captured on the dev box) would cause
# spurious PR failures on the windows-2022 runner.
#
# It is ADDITIVE: ci.yml (Phase-1 mandatory gate) is untouched/frozen.
# Perf Gate runs *in addition* on every PR to master. Ensure branch protection
# lists the "Performance budget (enforce)" check as required for it to block.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  perf-gate:
    name: Performance budget (enforce)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Build (Release)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: Run performance budget gate (hard fail on violation)
        # No `|| true`: a budget violation MUST block the PR.
        # Hard budget gate ONLY (no --regression): the budgets in
        # performance_budget.json are generous, cross-machine-stable absolute caps,
        # so this never fails on CI hardware jitter. Baseline-regression diff is a
        # SEPARATE axis run by nightly.yml.
        run: |
          $bin = "build_msvc\bin\mviewer_bench.exe"
          if (-not (Test-Path $bin)) { throw "benchmark binary missing after build" }
          & $bin --enforce --budget benchmark/performance_budget.json --results benchmark/report/perf-gate-verdicts.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PERFORMANCE BUDGET VIOLATED: a scenario exceeded its hard limit in benchmark/performance_budget.json. Fix the regression, or raise the limit only with an architectural justification."
            exit 1
          }
        shell: powershell

      - name: Upload verdict log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-verdicts
          path: |
            benchmark/report/
          if-no-files-found: ignore
