# =============================================================================
# MViewer CI — TIER 3: Release (tag / manual, full quality sweep)
# -----------------------------------------------------------------------------
# Runs on version tags (v*) and manual dispatch. This is the most expensive
# tier and is intentionally NOT part of the PR or nightly loops. It produces
# the shippable artifacts and the deepest quality signal:
#   * performance-report — full benchmark sweep + dashboard (Decode / Thumbnail
#     / Cache Hit / Compare / GPU Upload / Memory Peak project-specific gates)
#   * ui-regression       — full Golden Image UI regression (screenshots vs ref)
#   * dr-memory           — Windows memory-error check (best-effort signal)
#   * warm-cache          — one MSVC Release compile into the sccache GHA cache;
#                           the four Windows jobs below then mostly hit the
#                           cache instead of each compiling the app from scratch
#   * package             — portable zip + NSIS installer + symbols (PDB) zip
#   * release             — published GitHub release with all artifacts
#
# Reference docs: docs/acceptance/M13.3_perf_budget_gate.md,
#                 docs/acceptance/M13.5_perfetto.md
# =============================================================================

name: Release (Tier 3)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to draft the GitHub release

# Review P1-3: shared compiler cache. CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER
# from the environment, so build.ps1 stays unchanged. Release objects use /Z7
# (see CMakeLists.txt), which sccache can cache.
env:
  SCCACHE_GHA_ENABLED: "true"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  # ---------------------------------------------------------------------------
  # warm-cache — compile once into the shared sccache (review P1-3)
  # ---------------------------------------------------------------------------
  warm-cache:
    name: Compile once (sccache warm-up)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Build (Release)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # ---------------------------------------------------------------------------
  # performance-report — full benchmark sweep + dashboard
  # ---------------------------------------------------------------------------
  performance-report:
    name: Performance report
    runs-on: windows-2022
    needs: [warm-cache]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Build + Test
        run: |
          # testdata/ is git-ignored and regenerated by testdata_generator_gate;
          # Pillow is required to generate the JPEG/TIFF fixtures on a clean runner.
          python -m pip install --quiet --disable-pip-version-check Pillow
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Test

      - name: Run full benchmark sweep
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          cd build_msvc
          ctest -R 'bench_' --output-on-failure

      - name: Generate dashboard
        if: always()
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/benchmark_dashboard.ps1
        continue-on-error: true

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            build_msvc/benchmark_report.json
            benchmark/**

  # ---------------------------------------------------------------------------
  # ui-regression — full Golden Image UI regression (screenshots vs reference)
  # ---------------------------------------------------------------------------
  ui-regression:
    name: Full UI regression (Golden Image)
    runs-on: windows-2022
    needs: [warm-cache]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats   # qtiff.dll required for image-based tests
          cache: true

      - name: Build + Test
        run: |
          # testdata/ is git-ignored and regenerated by testdata_generator_gate;
          # Pillow is required to generate the JPEG/TIFF fixtures on a clean runner.
          python -m pip install --quiet --disable-pip-version-check Pillow
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Test

      - name: Golden Image full compare
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          cd build_msvc
          ctest -R 'golden_image' --output-on-failure

      - name: Upload golden diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-diffs
          path: golden/difference/

  # ---------------------------------------------------------------------------
  # dr-memory — Windows memory error check (best-effort signal)
  # Best-effort: Dr.Memory may need suppression tuning; it must not block the
  # release pipeline, but its report is uploaded for triage.
  # ---------------------------------------------------------------------------
  dr-memory:
    name: Dr.Memory (memory errors, best-effort)
    runs-on: windows-2022
    needs: [warm-cache]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (with PDBs for Dr.Memory symbols)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Build (Release, PDBs)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: Download Dr.Memory
        shell: bash
        run: |
          curl -L -o drmemory.zip https://github.com/DynamoRIO/drmemory/releases/download/release_2.6.0/DrMemory-Windows-2.6.0.zip
          unzip -q drmemory.zip
          echo "DRMEMORY_ROOT=$PWD/DrMemory-Windows-2.6.0" >> "$GITHUB_ENV"

      - name: Run Dr.Memory on core tests
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Get-ChildItem build_msvc -Recurse -Include core_tests.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "core_tests.exe not found"; exit 1 }
          & "$env:DRMEMORY_ROOT/bin/drmemory.exe" -batch -check_leaks 1 -results_dir drmemory_out -- $exe.FullName
        continue-on-error: true

      - name: Upload Dr.Memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drmemory-report
          path: drmemory_out/

  # ---------------------------------------------------------------------------
  # package — portable zip + NSIS installer
  # ---------------------------------------------------------------------------
  package:
    name: Package (zip + installer)
    runs-on: windows-2022
    needs: [warm-cache, performance-report, ui-regression]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true

      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Package and run Strict RC contract
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not ("${{ github.ref }}" -like 'refs/tags/*')) {
            $line = Get-Content build_msvc/version_info.txt | Where-Object { $_ -match '^MVIEWER_VERSION=' } | Select-Object -First 1
            $ver = $line.Substring('MVIEWER_VERSION='.Length).Trim()
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_release.ps1 -Version $ver -OutDir dist

      - name: Verify MViewer.exe is a GUI-subsystem binary (no console)
        run: |
          # Fail the release unless every shipped MViewer.exe has PE subsystem
          # 2 (WINDOWS_GUI): the portable zip and the NSIS Setup payload.
          $ErrorActionPreference = 'Stop'
          $check = Join-Path $PWD 'scripts/check_pe_subsystem.ps1'
          $zip = Get-ChildItem dist -Filter 'MViewer-*-portable.zip' | Select-Object -First 1
          $setup = Get-ChildItem dist -Filter 'MViewer-*-Setup.exe' | Select-Object -First 1
          if (-not $zip -or -not $setup) { throw 'portable zip or Setup.exe missing in dist/' }
          $work = Join-Path $env:RUNNER_TEMP 'pe-check'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath (Join-Path $work 'portable') -Force
          # 7-Zip (preinstalled on Windows runners) unpacks the NSIS payload.
          & 7z x -y ("-o" + (Join-Path $work 'setup')) $setup.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack $($setup.Name)" }
          $setupExe = Get-ChildItem (Join-Path $work 'setup') -Recurse -Filter 'MViewer.exe' | Select-Object -First 1
          if (-not $setupExe) { throw "no MViewer.exe inside $($setup.Name)" }
          $targets = @(
            (Join-Path $work 'portable/MViewer.exe'),
            $setupExe.FullName
          )
          foreach ($t in $targets) { if (-not (Test-Path -LiteralPath $t)) { throw "missing $t" } }
          & $check -Path $targets -Expected 2
          if ($LASTEXITCODE -ne 0) { throw 'MViewer.exe is not a Windows GUI-subsystem binary' }
          # The Setup payload must be the same MViewer.exe as the portable zip.
          $h = $targets | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }
          if ($h[0] -ne $h[1]) { throw 'Setup.exe and portable zip carry different MViewer.exe builds' }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($targets[0])
          Write-Host "MViewer.exe version resource: $($info.ProductName) $($info.ProductVersion) / $($info.FileDescription) / $($info.CompanyName)"
          if ([string]::IsNullOrWhiteSpace($info.ProductName) -or [string]::IsNullOrWhiteSpace($info.FileVersion)) {
            throw 'MViewer.exe has no VERSIONINFO resource'
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mviewer-release
          path: |
            dist/MViewer-*-portable.zip
            dist/MViewer-*-Setup.exe
            dist/MViewer-*-symbols.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

  # ---------------------------------------------------------------------------
  # release — publish the GitHub release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [package]
    # Only publish a GitHub release on a real version tag. Manual dispatch from a
    # branch (e.g. master) is used to verify the pipeline runs and must NOT
    # create a bogus "master" release.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release (all verified artifacts)
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: artifacts/mviewer-release/RELEASE_NOTES.md
          files: |
            artifacts/mviewer-release/MViewer-*-portable.zip
            artifacts/mviewer-release/MViewer-*-Setup.exe
            artifacts/mviewer-release/MViewer-*-symbols.zip
            artifacts/mviewer-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
