# =============================================================================
# MViewer CI — TIER 1: Pull-Request gate (must all pass, target 5-10 min)
# -----------------------------------------------------------------------------
# Per architect directive (2026-07-30) the single CI file is split into three
# independently-scheduled tiers so the PR gate stays fast and the heavy
# sanitizer / benchmark / UI-regression work does not slow down every PR.
#
# This file (Tier 1 / PR gate) runs on every PR and on every push to master.
# REQUIRED jobs (branch protection depends on the `ci-gate` aggregator):
#   format    — clang-format (C++20/Qt6) + markdownlint
#   cppcheck  — supplemental static analysis (NEW, required)
#   clang-tidy— bug-finding static analysis, REQUIRED, PR-incremental
#   build     — MSVC + Qt 6.8.0, zero compiler warnings (warnings-as-errors)
#   test      — CTest (unit tests + bench_enforce perf hard-gate + golden_image)
#
# The Tier-2 (nightly) and Tier-3 (release) workflows live in nightly.yml and
# release.yml respectively and intentionally do NOT block PRs.
#
# PR gate expectations (all must pass for a mergeable PR):
#   * clang-format --dry-run passes (no formatting diffs)
#   * markdownlint passes on all .md docs
#   * cppcheck reports no warning/performance/portability findings in src/
#   * clang-tidy reports no bugprone/performance/clang-analyzer findings in PR
#     changed files (incremental — legacy code is not re-checked on PRs)
#   * build succeeds on windows-2022 (MSVC + Qt 6.8.0)
#   * zero compiler warnings in the build log (warnings-as-errors)
#   * unit tests (CTest) pass, including the bench_enforce perf hard-gate
# =============================================================================

name: PR Gate (Tier 1)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # format — clang-format + markdownlint (ubuntu, fast)
  # ---------------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format

      - name: clang-format (C++20 / Qt6)
        run: |
          find . \( -name '*.cpp' -o -name '*.h' \) \
            -not -path './build_msvc/*' \
            -not -path './build/*' \
            -not -path './.git/*' \
            -not -path '*/Qt/*' \
            -not -path '*/Qt6/*' \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint --config .markdownlint.jsonc '**/*.md' --ignore node_modules

  # ---------------------------------------------------------------------------
  # cppcheck — supplemental static analysis (ubuntu, required, NEW in Tier 1)
  # High-signal bug/performance/portability findings only. System includes
  # (Qt, STL) are suppressed so we only flag issues in our own src/.
  # ---------------------------------------------------------------------------
  cppcheck:
    name: Static analysis (cppcheck, required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck + Qt6 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck qt6-base-dev

      - name: Run cppcheck (required — fails on findings)
        run: |
          cppcheck --enable=warning,performance,portability \
            --std=c++20 --inline-suppr --error-exitcode=1 \
            --suppressions-list=scripts/cppcheck-suppressions.txt \
            -I src -I src/core -I src/benchmark -I src/ui \
            src 2> cppcheck.txt || {
              echo "::error:: cppcheck found warning/performance/portability issues (see artifact)"
              cat cppcheck.txt
              exit 1
            }
          echo "cppcheck clean"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck.txt

  # ---------------------------------------------------------------------------
  # clang-tidy — bug-finding static analysis (ubuntu, REQUIRED, PR-incremental)
  #
  # Unlike the old advisory job, this is now a hard gate: any
  # bugprone-/performance-/clang-analyzer- finding in the PR's *changed* files
  # fails the build (--warnings-as-errors). Running incrementally keeps the PR
  # fast and avoids blocking on pre-existing findings in untouched code.
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: Static analysis (clang-tidy, required)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-tidy + clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy clang-tools cmake ninja-build

      - name: Install Qt6 (headers only, for analysis)
        run: sudo apt-get install -y qt6-base-dev

      - name: Configure (export compile_commands.json)
        run: |
          cmake -S . -B build_sa \
            -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang

      - name: Determine changed C++ files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
                     -- 'src/**/*.cpp' 'src/**/*.h')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD \
                     -- 'src/**/*.cpp' 'src/**/*.h')
          fi
          FILES=$(echo "$FILES" | grep -v -E 'build' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed files to analyze:"; echo "$FILES"

      - name: Run clang-tidy (required, changed files only)
        shell: bash
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No changed C++ files to analyze — passing."
            exit 0
          fi
          echo "$FILES" | tr '\n' '\0' | xargs -0 clang-tidy -p build_sa \
            --checks='bugprone-*,performance-*,clang-analyzer-*,cppcoreguidelines-pro-type-*,cppcoreguidelines-special-member-functions' \
            --warnings-as-errors='bugprone-*,performance-*,clang-analyzer-*,cppcoreguidelines-pro-type-*'
          echo "clang-tidy clean on changed files"

  # ---------------------------------------------------------------------------
  # build — MSVC + Qt 6.8.0, enforce zero warnings from build log
  # (this implements the "warnings-as-errors" PR requirement)
  # ---------------------------------------------------------------------------
  build:
    name: Build (MSVC + Qt 6.8.0)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats   # provides the TIFF plugin (qtiff.dll) required by M3/M5 golden tests
          cache: true

      - name: Build (compile + deploy; zero-warnings gate)
        run: |
          # `Release` compiles and deploys Qt/CRT but does NOT run CTest — the
          # dedicated `test` job owns CTest (incl. the bench_enforce perf gate),
          # so the suite executes exactly once per PR instead of twice. Tee
          # preserves build.log for the zero-warnings grep below; the
          # $LASTEXITCODE guard keeps a compile failure from being masked by
          # Tee-Object.
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce zero warnings
        run: |
          # Match MSVC compiler warnings (e.g. "warning C1234:") only.
          # Do NOT match ctest's own "WARNING: Tests failed" status
          # line (uppercase, no code) that build.ps1 pipes into build.log.
          $m = Select-String -Path build.log -Pattern 'warning C\d'
          if ($m) {
            Write-Host "::error:: Zero-warnings gate: build.log contains compiler warning(s):"
            $m | ForEach-Object { Write-Host ("  " + $_.Line) }
            exit 1
          }

  # ---------------------------------------------------------------------------
  # test — CTest job (separate runner; artifacts not shared)
  # Runs CTest directly with an explicit $LASTEXITCODE guard so the
  # bench_enforce perf hard-gate and golden_image regression are ACTUALLY
  # enforced (build.ps1 Test swallows CTest failures, so we do not use it).
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests (ctest)
    runs-on: windows-2022
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.0
          arch: win64_msvc2022_64
          modules: qtimageformats   # provides the TIFF plugin (qtiff.dll) required by M3/M5 golden tests
          cache: true

      # `build.ps1 Release` recompiles on this fresh runner (job isolation);
      # then CTest runs directly with an explicit $LASTEXITCODE guard.
      # NOTE: build.ps1 Test swallows CTest failures (Write-Warning, no exit),
      # so we must NOT rely on its exit code — run CTest explicitly so any unit
      # test or bench_enforce perf-budget violation actually fails the PR.
      - name: Build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 Release

      - name: Test (ctest; fails on any failure, incl. perf gate)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:PATH = "$env:QT_ROOT_DIR\bin" + [System.IO.Path]::PathSeparator + $env:PATH
          cd build_msvc
          ctest --output-on-failure --output-junit test-results.xml -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build_msvc/test-results.xml

  # ---------------------------------------------------------------------------
  # ci-gate — aggregate required statuses for branch protection
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI gate (Tier 1)
    runs-on: ubuntu-latest
    needs: [format, cppcheck, clang-tidy, build, test]
    if: always()
    steps:
      - name: All required jobs passed
        run: echo "format, cppcheck, clang-tidy, build, and test all succeeded (Tier-2 nightly / Tier-3 release are non-blocking for PRs)."
